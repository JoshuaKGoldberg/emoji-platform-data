jobs:
  refresh_android:
    name: Refresh Android Data
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      # Ubuntu's own erofs-utils is too old to have dump.erofs --cat, but the
      # runner comes with Homebrew, just not on its PATH.
      - name: Install erofs-utils
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          /home/linuxbrew/.linuxbrew/bin/brew install erofs-utils
      - name: Read Android emoji data out of Gboard
        run: pnpm --filter @emoji-platform-data/generator refresh:android
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        name: Open a pull request if the data changed
        run: |
          if git diff --quiet -- packages/generator/android.json; then
            echo "Android emoji data is unchanged."
            exit 0
          fi

          pack=$(jq -r '.pack' packages/generator/android.json)
          count=$(jq '.entries | length' packages/generator/android.json)
          keywords=$(jq '[.entries[].keywords | length] | add' packages/generator/android.json)
          branch=refresh-android-data

          cat > .changeset/refresh-android-data.md <<CHANGESET
          ---
          "@emoji-platform-data/android": minor
          "emoji-platform-data": minor
          ---

          Updated Android emoji data to Gboard's $pack.
          CHANGESET

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$branch"
          git add .changeset/refresh-android-data.md packages/generator/android.json
          git commit -m "feat: update Android emoji data"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git" "HEAD:refs/heads/$branch"

          if [ "$(gh pr list --head "$branch" --state open --json number | jq length)" != "0" ]; then
            echo "Updated the existing pull request."
            exit 0
          fi

          gh pr create \
            --base main \
            --body "Gboard's bundled emoji search data changed, to $pack. This refreshes \`packages/generator/android.json\` to the $count emoji it knows now, with $keywords keywords between them. See \`packages/android/DEVELOPMENT.md\` for how the extraction works." \
            --head "$branch" \
            --title "feat: update Android emoji data"

name: Refresh Android Data

on:
  schedule:
    - cron: "0 14 5 * *"
  workflow_dispatch: ~
