name: OctoGuide

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- reads PR metadata only, no checkout
    types:
      - edited
      - opened

jobs:
  octoguide:
    if: ${{ !endsWith(github.actor, '[bot]') && !contains(github.event.pull_request.labels.*.name, 'autorelease') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: octoguide/bot@8d29abce6793b35c6bfab51d4db6bfa62634b871 # 0.33.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          rules: |-
            {
              "pr-title-conventional": true
            }
