concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  pack:
    if: needs.select_mode.outputs.mode == 'publish'
    name: Pack
    needs: select_mode
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: pnpm build
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select_mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish
    needs: pack
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.ACCESS_TOKEN }}
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_PACKAGES: ${{ steps.publish.outputs.published-packages }}
        if: ${{ !cancelled() && steps.publish.outputs.published == 'true' }}
        name: Comment on released pull requests
        run: |
          # Each package's release notes link the pull requests that went into
          # it. A pull request can go into many packages' releases at once, so
          # it gets one comment listing them all, rather than one per release.
          for tag in $(jq -r '.[] | "\(.name)@\(.version)"' <<< "$PUBLISHED_PACKAGES"); do
            url=$(gh release view "$tag" --json url --jq .url)
            gh release view "$tag" --json body --jq .body |
              grep -oE '/pull/[0-9]+' |
              cut -d / -f 3 |
              sort -u |
              sed "s|\$| [\`$tag\`]($url)|"
          done | sort -n > "$RUNNER_TEMP/released.txt"

          for pr in $(cut -d ' ' -f 1 "$RUNNER_TEMP/released.txt" | uniq); do
            releases=$(grep "^$pr " "$RUNNER_TEMP/released.txt" | cut -d ' ' -f 2- | sed 's/^/- /')
            body=$(printf ':tada: This has been released in:\n\n%s\n\nCheers! 📦🚀' "$releases")

            gh pr comment "$pr" --body "$body"

            for issue in $(gh pr view "$pr" --json closingIssuesReferences --jq '.closingIssuesReferences[].number'); do
              gh issue comment "$issue" --body "$body"
            done
          done

  select_mode:
    name: Select Mode
    outputs:
      mode: ${{ steps.select_mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select_mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - id: select_mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    if: needs.select_mode.outputs.mode == 'version'
    name: Version
    needs: select_mode
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "chore: version packages"
          github-token: ${{ secrets.ACCESS_TOKEN }}
          pr-title: "chore: version packages"

name: Release

on:
  push:
    branches:
      - main

permissions: {}
