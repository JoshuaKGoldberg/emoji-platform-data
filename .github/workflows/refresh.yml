jobs:
  refresh:
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.platform }}
    name: Refresh ${{ matrix.name }} Data
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      # Ubuntu's own erofs-utils is too old to have dump.erofs --cat, but the
      # runner comes with Homebrew, just not on its PATH.
      - if: matrix.platform == 'android'
        name: Install erofs-utils
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          /home/linuxbrew/.linuxbrew/bin/brew install erofs-utils
      - env:
          PLATFORM: ${{ matrix.platform }}
        name: Read ${{ matrix.name }} emoji data
        # The output is kept so that a failure can be reported with it.
        run: |
          set -o pipefail
          pnpm --filter @emoji-platform-data/generator "refresh:$PLATFORM" 2>&1 | tee "$RUNNER_TEMP/refresh.log"
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          NAME: ${{ matrix.name }}
          PLATFORM: ${{ matrix.platform }}
        name: Open a pull request if the data changed
        run: |
          snapshot="packages/generator/$PLATFORM.json"
          branch="refresh-$PLATFORM-data"
          pr_number=$(gh pr list --head "$branch" --state open --json isCrossRepository,number --jq '.[] | select(.isCrossRepository | not) | .number')

          if git diff --quiet -- "$snapshot"; then
            echo "$NAME emoji data is unchanged."

            # A pull request from an earlier refresh is out of date once the
            # data matches main again, such as when an upstream change is undone.
            if [ -n "$pr_number" ]; then
              gh pr close "$pr_number" --comment "$NAME emoji data matches \`main\` again, so this is no longer needed." --delete-branch
            fi

            exit 0
          fi

          # What the new data came from: a version when the source has one,
          # which goes in the title too, or else where it was read from.
          version=""
          source=""

          case "$PLATFORM" in
            android)
              version="Gboard's $(jq -r '.pack' "$snapshot")"
              ;;
            discord | slack)
              source="the web client bundle"
              ;;
            gnome)
              version="GTK $(jq -r '.gtk' "$snapshot")"
              ;;
            macos)
              macos_version=$(jq -r '.macosVersion' "$snapshot")
              previous_version=$(git show "HEAD:$snapshot" | jq -r '.macosVersion')
              oldest_version=$(printf '%s\n%s\n' "$macos_version" "$previous_version" | sort -V | head -1)

              # Runner images can lag behind the macOS whoever last refreshed
              # the snapshot was on, and that data shouldn't be rolled back to
              # an older release's.
              if [ "$macos_version" != "$previous_version" ] && [ "$oldest_version" = "$macos_version" ]; then
                echo "This runner is on macOS $macos_version, older than the committed snapshot's macOS $previous_version."
                exit 0
              fi

              version="macOS $macos_version"
              ;;
            wechat)
              source="the Android app"
              ;;
            windows)
              version="Windows 11 $(jq -r '.release' "$snapshot")"
              ;;
            *)
              echo "No description for how $PLATFORM's data changes."
              exit 1
              ;;
          esac

          count=$(jq '.entries | length' "$snapshot")
          keyworded=$(jq '[.entries[] | select(.keywords | length > 0)] | length' "$snapshot")
          added=$(git show "HEAD:$snapshot" | jq --slurpfile new "$snapshot" '[$new[0].entries[].emoji] - [.entries[].emoji] | length')
          changeset=".changeset/refresh-$PLATFORM-data-$GITHUB_RUN_ID.md"

          if [ "$added" -gt 0 ]; then
            bump="minor"
            type="feat"
          else
            bump="patch"
            type="fix"
          fi

          if [ -n "$version" ]; then
            summary="Updated $NAME emoji data to $version."
            title="$type: update $NAME emoji data to $version"
          else
            summary="Updated $NAME emoji data from $source."
            title="$type: update $NAME emoji data"
          fi

          # New names from one platform can retitle emoji that other platforms
          # have too, so every package whose built output changes is released,
          # along with the generator, which publishes the snapshot itself.
          hash_packages() {
            for directory in packages/*/; do
              if [ -d "$directory/lib/data" ]; then
                printf '%s %s\n' "$(jq -r .name "$directory/package.json")" "$(find "$directory/lib" -type f | sort | xargs shasum | shasum | cut -d ' ' -f 1)"
              fi
            done
          }

          cp "$snapshot" "$RUNNER_TEMP/snapshot.json"
          git checkout HEAD -- "$snapshot"
          pnpm build > /dev/null
          hash_packages > "$RUNNER_TEMP/before.txt"
          cp "$RUNNER_TEMP/snapshot.json" "$snapshot"
          pnpm build > /dev/null
          hash_packages > "$RUNNER_TEMP/after.txt"

          releases=$(
            {
              echo "@emoji-platform-data/generator"
              comm -13 <(sort "$RUNNER_TEMP/before.txt") <(sort "$RUNNER_TEMP/after.txt") | cut -d ' ' -f 1
            } | sort -u | sed "s/.*/\"&\": $bump/"
          )

          cat > "$changeset" <<CHANGESET
          ---
          $releases
          ---

          $summary
          CHANGESET

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$branch"
          git add "$changeset" "$snapshot"
          git commit -m "$title"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git" "HEAD:refs/heads/$branch"

          body=$(cat <<BODY
          ## PR Checklist

          - [x] Steps in [CONTRIBUTING.md](https://github.com/$GH_REPO/blob/main/.github/CONTRIBUTING.md) were taken
          - [x] If this changes what a package publishes, a changeset was added with \`pnpm changeset\` (see [DEVELOPMENT.md](https://github.com/$GH_REPO/blob/main/.github/DEVELOPMENT.md#releasing))

          ## Overview

          $summary This refreshes \`$snapshot\` to the $count emoji it has now, $keyworded of them with search keywords. See \`packages/$PLATFORM/DEVELOPMENT.md\` for how the extraction works.

          🗝️
          BODY
          )

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --body "$body" --title "$title"
            exit 0
          fi

          gh pr create \
            --base main \
            --body "$body" \
            --head "$branch" \
            --title "$title"
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.name }}
          PLATFORM: ${{ matrix.platform }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        if: failure()
        name: Report the failure in an issue
        run: |
          set -o pipefail
          title="🛠 Tooling: Refresh $NAME Data is failing"
          existing=$(gh issue list --state open --json number,title --limit 100 | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -1)

          # The refresh scripts' errors say what looked wrong, such as a known
          # keyword going missing, so the end of their output goes in the issue.
          # A failure in any other step has no output here, and links the run.
          if [ -s "$RUNNER_TEMP/refresh.log" ]; then
            output=$(tail -n 40 "$RUNNER_TEMP/refresh.log" | perl -pe 's/\e\[[0-9;]*m//g')
            details=$(printf 'The end of its output:\n\n~~~\n%s\n~~~' "$output")
          else
            details="It failed before reading any data, so see the run for what went wrong."
          fi

          body=$(printf '[Refreshing %s data](%s) failed on %s.\n\n%s\n\nSee `packages/%s/DEVELOPMENT.md` for how the extraction works.' "$NAME" "$RUN_URL" "$(date -u +%Y-%m-%d)" "$details" "$PLATFORM")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --body "$body" --label "area: tooling" --label "type: bug" --title "$title"
          fi
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        if: success()
        name: Close the failure issue, if there is one
        run: |
          set -o pipefail
          title="🛠 Tooling: Refresh $NAME Data is failing"
          existing=$(gh issue list --state open --json number,title --limit 100 | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -1)

          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "[Refreshing $NAME data]($RUN_URL) succeeded again."
          fi
    strategy:
      # Each platform's source can break on its own, so one failing
      # shouldn't stop the others from refreshing.
      fail-fast: false
      matrix:
        include:
          - name: Android
            platform: android
            runner: ubuntu-latest
          - name: Discord
            platform: discord
            runner: ubuntu-latest
          - name: GNOME
            platform: gnome
            runner: ubuntu-latest
          # macOS's emoji data is only readable from its system frameworks.
          - name: macOS
            platform: macos
            runner: macos-latest
          - name: Slack
            platform: slack
            runner: ubuntu-latest
          - name: WeChat
            platform: wechat
            runner: ubuntu-latest
          - name: Windows
            platform: windows
            runner: ubuntu-latest

name: Refresh Data

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: ~
