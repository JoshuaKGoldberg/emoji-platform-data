jobs:
  refresh_gnome:
    name: Refresh GNOME Data
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: Read GNOME emoji data out of GTK
        run: pnpm --filter @emoji-platform-data/generator refresh:gnome
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        name: Open a pull request if the data changed
        run: |
          if git diff --quiet -- packages/generator/gnome.json; then
            echo "GNOME emoji data is unchanged."
            exit 0
          fi

          gtk=$(jq -r '.gtk' packages/generator/gnome.json)
          count=$(jq '.entries | length' packages/generator/gnome.json)
          keyworded=$(jq '[.entries[] | select(.keywords | length > 0)] | length' packages/generator/gnome.json)
          branch=refresh-gnome-data

          cat > .changeset/refresh-gnome-data.md <<CHANGESET
          ---
          "@emoji-platform-data/gnome": minor
          "emoji-platform-data": minor
          ---

          Updated GNOME emoji data to GTK $gtk.
          CHANGESET

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$branch"
          git add .changeset/refresh-gnome-data.md packages/generator/gnome.json
          git commit -m "feat: update GNOME emoji data to GTK $gtk"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git" "HEAD:refs/heads/$branch"

          if [ "$(gh pr list --head "$branch" --state open --json number | jq length)" != "0" ]; then
            echo "Updated the existing pull request."
            exit 0
          fi

          gh pr create \
            --base main \
            --body "GTK $gtk changed its emoji data. This refreshes \`packages/generator/gnome.json\` to the $count emoji it lists now, $keyworded of them with search keywords. See \`packages/gnome/DEVELOPMENT.md\` for how the extraction works." \
            --head "$branch" \
            --title "feat: update GNOME emoji data to GTK $gtk"

name: Refresh GNOME Data

on:
  schedule:
    - cron: "0 14 4 * *"
  workflow_dispatch: ~
