jobs:
  refresh_windows:
    name: Refresh Windows Data
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: Read Windows emoji data out of its typing features
        run: pnpm --filter @emoji-platform-data/generator refresh:windows
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        name: Open a pull request if the data changed
        run: |
          if git diff --quiet -- packages/generator/windows.json; then
            echo "Windows emoji data is unchanged."
            exit 0
          fi

          release=$(jq -r '.release' packages/generator/windows.json)
          count=$(jq '.entries | length' packages/generator/windows.json)
          keyworded=$(jq '[.entries[] | select(.keywords | length > 0)] | length' packages/generator/windows.json)
          branch=refresh-windows-data

          cat > .changeset/refresh-windows-data.md <<CHANGESET
          ---
          "@emoji-platform-data/windows": minor
          "emoji-platform-data": minor
          ---

          Updated Windows emoji data to Windows 11 $release.
          CHANGESET

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$branch"
          git add .changeset/refresh-windows-data.md packages/generator/windows.json
          git commit -m "feat: update Windows emoji data to Windows 11 $release"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git" "HEAD:refs/heads/$branch"

          if [ "$(gh pr list --head "$branch" --state open --json number | jq length)" != "0" ]; then
            echo "Updated the existing pull request."
            exit 0
          fi

          gh pr create \
            --base main \
            --body "Windows 11 $release changed the emoji panel's keywords. This refreshes \`packages/generator/windows.json\` to the $count emoji it knows now, $keyworded of them with search keywords. See \`packages/windows/DEVELOPMENT.md\` for how the extraction works." \
            --head "$branch" \
            --title "feat: update Windows emoji data to Windows 11 $release"

name: Refresh Windows Data

on:
  schedule:
    - cron: "0 14 3 * *"
  workflow_dispatch: ~
